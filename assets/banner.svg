<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- decorative speed lines -->
  <g stroke="#58a6ff" stroke-opacity="0.15" stroke-width="3">
    <line x1="0" y1="60" x2="220" y2="60"/>
    <line x1="0" y1="80" x2="160" y2="80"/>
    <line x1="0" y1="100" x2="260" y2="100"/>
    <line x1="980" y1="280" x2="1200" y2="280"/>
    <line x1="1000" y1="300" x2="1200" y2="300"/>
    <line x1="940" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- decorative keyboard keys -->
  <g fill="url(#keyGrad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5">
    <rect x="70" y="40" width="46" height="36" rx="6"/>
    <rect x="128" y="40" width="46" height="36" rx="6"/>
    <rect x="70" y="86" width="46" height="36" rx="6"/>
    <rect x="1020" y="230" width="46" height="36" rx="6"/>
    <rect x="1078" y="230" width="46" height="36" rx="6"/>
    <rect x="1020" y="276" width="46" height="36" rx="6"/>
  </g>

  <!-- Esc key highlight -->
  <g>
    <rect x="55" y="130" width="70" height="46" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="90" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="16.0" fill="#58a6ff" fill-opacity="0.6" text-anchor="middle">Esc</text>
  </g>

  <!-- soft circles -->
  <circle cx="150" cy="270" r="90" fill="#58a6ff" fill-opacity="0.05"/>
  <circle cx="1080" cy="90" r="110" fill="#58a6ff" fill-opacity="0.05"/>

  <!-- Headline -->
  <text x="600" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="52.0" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <tspan x="600" dy="0">+1 Speed Keyboard</tspan>
    <tspan x="600" dy="60">Escape Script</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9" text-anchor="middle">
    +1 Speed Keyboard Escape Script — a lightweight Windows tool.
  </text>
</svg>